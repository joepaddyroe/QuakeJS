<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuakeJS</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Consolas, "Courier New", monospace;
    }
    #viewport {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #hud {
      position: fixed;
      left: 12px;
      top: 10px;
      color: #c8c4b8;
      font-size: 13px;
      line-height: 1.45;
      pointer-events: none;
      text-shadow: 0 1px 2px #000;
      white-space: pre;
    }
    #sbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      pointer-events: none;
      display: none;
    }
    #hud .dim { color: #7a766c; }
    #error {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #f0e6d8;
      background: #1a1510;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
    }
    #error.visible { display: flex; }
  </style>
</head>
<body>
  <canvas id="viewport"></canvas>
  <canvas id="sbar"></canvas>
  <div id="hud"></div>
  <div id="error"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
